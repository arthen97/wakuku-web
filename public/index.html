<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAKUKU · 星球来信</title><meta name="description" content="和苔苔一起，在风铃草甸写下第一封星球来信。21:9 可玩篇章。"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091718;color:#f7efd7;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}#stage{position:relative;width:min(100vw,calc((100dvh - 42px)*7/3));aspect-ratio:7/3;box-shadow:0 0 100px #0008}canvas{display:block;width:100%;height:100%;outline:0}#loader{position:absolute;inset:0;background:linear-gradient(90deg,#092024ed,#09202450),url('cover.png') center/cover;display:flex;flex-direction:column;justify-content:center;padding:7%;transition:opacity .5s}#loader.hidden{opacity:0;pointer-events:none}small{letter-spacing:.25em;color:#e8d5a3}h1{font-size:clamp(24px,5vw,70px);font-weight:300;letter-spacing:.12em;margin:.4em 0}.subtitle{font-size:clamp(16px,2vw,27px);letter-spacing:.22em}p{line-height:1.7;max-width:600px;font-size:clamp(12px,1.1vw,17px)}button{font:inherit;color:#233c35;background:#ead7a2;border:1px solid #d8c99d;border-radius:4px;cursor:pointer;padding:12px 22px}button:hover{background:#fff1c8}button:disabled{opacity:.55;cursor:wait}#start{max-width:270px;margin:12px 0}progress{width:min(420px,70%);height:4px;accent-color:#e7d6a3;margin:14px 0}#load-state{font-size:13px;color:#dbe4d2}#toolbar{position:fixed;bottom:0;left:0;right:0;height:40px;display:flex;gap:15px;align-items:center;justify-content:center;background:#0a1d1e;color:#b4c8be;font-size:12px}#toolbar button{font-size:12px;background:transparent;color:#d5dece;border:0;padding:5px 10px}#toolbar button:hover{background:#29423d}#notice{position:fixed;bottom:45px;left:50%;transform:translateX(-50%);padding:8px 16px;background:#173c36;border-radius:5px;max-width:85vw;text-align:center;font-size:14px}#notice:empty{display:none}#error{max-width:600px;color:#ffdfc1;white-space:pre-wrap}a{color:#e3d5ad}#portrait-note{display:none}@media(max-width:760px){#toolbar{gap:4px}#build{display:none}}@media(orientation:portrait){#portrait-note{display:block;color:#ffe2a1;font-size:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main id="stage"><canvas id="canvas" width="1680" height="720" tabindex="0" aria-label="WAKUKU 星球来信游戏画面">需要支持 WebGL 2 的浏览器。</canvas><section id="loader"><small>ARTHEN PRESENTS</small><h1>WAKUKU</h1><div class="subtitle">星球来信</div><p>一朵花，一阵风，一封还没有寄出的信。<br>当前开放：苔苔 · 风铃草甸</p><button id="start">开启旅程　→</button><progress id="progress" value="0" max="1" hidden></progress><div id="load-state">首次进入需下载完整环境与声音资源。</div><div id="portrait-note">建议横屏，并使用键盘和鼠标游玩。</div><div id="error" role="alert"></div></section></main>
<nav id="toolbar" aria-label="游戏工具"><span id="build">HTML / WebGL · v0.10.2</span><button id="fullscreen">全屏</button><button id="save-out">导出存档</button><button id="save-in">导入存档</button><a href="release-manifest.json" target="_blank">版本信息</a></nav><input id="save-file" type="file" accept="application/json,.json" hidden><div id="notice" role="status"></div>
<script src="index.js"></script><script>
const CONFIG={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":215667428,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const canvas=document.querySelector('#canvas'),loader=document.querySelector('#loader'),start=document.querySelector('#start'),progress=document.querySelector('#progress'),state=document.querySelector('#load-state'),error=document.querySelector('#error');
let running=false,starting=false,noticeTimer;
function notice(message){document.querySelector('#notice').textContent=message;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>document.querySelector('#notice').textContent='',6000)}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const engine=new Engine({...CONFIG,canvas,locale:'zh_CN',onPrint:(...args)=>{console.log(...args);if(args.join(' ').includes('WAKUKU_GODOT_READY')){running=true;state.textContent='小星球已准备好'}},onPrintError:(...args)=>{console.error(...args)}});
start.addEventListener('click',async()=>{if(starting)return;starting=true;start.disabled=true;progress.hidden=false;error.textContent='';
try{const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw new Error('浏览器缺少 '+missing.join('、')+'，请使用新版 Chrome 或 Edge。');state.textContent='正在下载完整小星球…';await engine.startGame({onProgress:(current,total)=>{if(total>0){progress.value=current/total;state.textContent=`正在载入 ${Math.round(current/1048576)} / ${Math.round(total/1048576)} MB`}},onExit:()=>{running=false;notice('游戏已关闭，刷新页面可重新进入。')}});loader.classList.add('hidden');canvas.focus();}catch(e){error.textContent='载入未完成：'+e.message;start.textContent='刷新后重试';start.disabled=false;start.onclick=()=>location.reload();} });
document.querySelector('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();canvas.focus()}catch(e){notice('浏览器未允许全屏，可手动放大窗口。')}};
document.querySelector('#save-out').onclick=()=>{if(!window.wakukuSave){notice('请先进入游戏，等待小星球载入完成。');return}const blob=new Blob([window.wakukuSave],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='WAKUKU-星球来信-存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);canvas.focus()};
document.querySelector('#save-in').onclick=()=>{if(!window.wakukuImportSave){notice('请先进入游戏，再导入存档。');return}document.querySelector('#save-file').click()};
document.querySelector('#save-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000)throw new Error('文件过大');const record=JSON.parse(await f.text());if(record.game!=='wakuku-planet-letter'||record.version!==1||!Number.isInteger(record.step)||record.step<0||record.step>7||!['','stay','return'].includes(record.choice))throw new Error('不是有效的星球来信存档');window.wakukuImportSave(JSON.stringify(record));notice('存档已导入，请从旅程选择页继续。')}catch(e){notice('无法导入：'+e.message)}finally{e.target.value='';canvas.focus()}};
</script></body></html>
