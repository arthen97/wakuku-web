<style>

n{font-size:11px;background:transparent;color:inherit;border:0;padding:5px 8px}#toolbar a{color:inherit;text-decoration:none}#notice{position:fixed;bottom:43px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#fcf5df;color:#294638;border-radius:30px;max-width:85vw;text-align:center;font-size:13px;z-index:20;box-shadow:0 2px 15px #10261940}#notice:empty{display:none}#portrait-note{display:none}@media(max-width:800px){#build{display:none}.masthead .right{gap:4px}.cast{bottom:14%}.bottom p{display:none}.selection-footer p{max-width:38%;font-size:9px}.primary{padding:9px 14px}}@media(orientation:portrait){#portrait-note{display:block;position:fixed;top:20%;color:#e3e8d3;font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="portrait-note">横过屏幕，让小星球展开。</div>
<main id="stage"><canvas id="canvas" width="1680" height="720" tabindex="0" aria-label="WAKUKU 星球来信游戏画面">需要支持 WebGL 2 的浏览器。</canvas>
<section id="journey" aria-label="旅程选择">
<div id="still" class="backdrop"></div><video id="film-a" class="backdrop" aria-hidden="true" muted playsinline preload="none"></video><video id="film-b" class="backdrop" aria-hidden="true" muted playsinline preload="none"></video><div id="wash"></div>

<section class="page" data-page="0" aria-label="开场">
<div class="intro-title animate"><h1>WAKUKU</h1><p>星 球 来 信</p></div><div class="bottom animate"><div><div class="eyebrow">A LITTLE PLANET. A LETTER FOR YOU.</div><h2>世界很小，奇遇很大。</h2><p>和五位旅伴相遇，从苔苔的第一封信出发。</p></div><button class="primary" id="choose-cast">选择旅伴<span>→</span></button></div>
</section>
<section class="page" data-page="1" hidden aria-label="选择旅伴">
<div class="heading animate"><h2>想和谁一起出发？</h2><p>五位小小旅伴，五种认识世界的方式</p></div>
<div class="cast animate"><button data-character="pearl"><strong>珍珠</strong><small>PEARL · 故事待续</small></button><button data-character="candy"><strong>糖糖</strong><small>CANDY · 故事待续</small></button><button data-character="moss" class="selected" aria-pressed="true"><strong>苔苔</strong><small>MOSS · 当前旅伴</small></button><button data-character="bonbon"><strong>邦邦</strong><small>BONBON · 故事待续</small></button><button data-character="lilac"><strong>丁香</strong><small>LILAC · 故事待续</small></button></div>
<div class="selection-footer animate"><button class="back" data-nav="0">← 回到花园</button><p id="cast-caption">苔苔 · 照料一朵花，认识整个世界。</p><button class="primary" data-nav="2">带苔苔去旅行<span>→</span></button></div>
</section>
<section class="page" data-page="2" hidden aria-label="选择目的地">
<div class="heading animate"><h2>下一封信，从这里开始。</h2><p>小星球上的第一站，风铃草甸</p></div>
<div class="destination-list animate"><button class="place selected" data-place="meadow" aria-pressed="true"><span class="number">01 / OPEN CHAPTER</span><h3>风铃草甸</h3><p>一朵花，一阵风，一个小小的约定。<br>可游玩 · 苔苔的第一封信</p></button><button class="place" data-place="canopy"><span class="number">02 / COMING LATER</span><h3>回声树海</h3><p>听见叶片间尚未寄出的回声。<br>尚未开放</p></button><button class="place" data-place="creek"><span class="number">03 / COMING LATER</span><h3>星露溪谷</h3><p>沿着水光，寻找下一颗星。<br>尚未开放</p></button></div>
<div class="selection-footer animate"><button class="back" data-nav="1">← 选择旅伴</button><label class="restart" id="restart-label" hidden><input type="checkbox" id="restart">从第一封信重新开始</label><button class="primary" id="enter" disabled>正在准备小星球…</button></div>
</section>
<div id="load-state" role="status"></div><div id="loading" hidden><i></i></div><div id="error" role="alert"></div>
</section></main>
<nav id="toolbar" aria-label="游戏工具"><span id="build">WAKUKU · v0.11.0 · 抢先体验</span><button id="fullscreen">全屏</button><button id="save-out">导出存档</button><button id="save-in">导入存档</button><a href="release-manifest.json" target="_blank">版本信息</a></nav><input id="save-file" type="file" accept="application/json,.json" hidden><div id="notice" role="status"></div>
<script src="index.js"></script><script>
const CONFIG={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":168313372,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const $=s=>document.querySelector(s),canvas=$('#canvas'),menu=$('#journey'),state=$('#load-state'),error=$('#error'),enter=$('#enter');
const films=[$('#film-a'),$('#film-b')],reduced=matchMedia('(prefers-reduced-motion:reduce)');
const clips=['menu-opening.mp4','menu-travellers.mp4','menu-destination.mp4'];
let page=0,active=-1,filmToken=0,motionOn=!reduced.matches,ready=false,saved=false,starting=false,running=false,callback=null,noticeTimer,soundOn=false;
const score=new Audio('menu-score.ogg');score.loop=true;score.volume=.2;
function notice(t){$('#notice').textContent=t;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#notice').textContent='',5000)}
function fitCanvas(){const box=$('#stage').getBoundingClientRect(),target=Math.min(2520,box.width*Math.min(devicePixelRatio||1,1.5)),unit=Math.max(120,Math.round(target/7));if(canvas.width!==unit*7||canvas.height!==unit*3){canvas.width=unit*7;canvas.height=unit*3}}
fitCanvas();new ResizeObserver(fitCanvas).observe($('#stage'));addEventListener('resize',fitCanvas);canvas.addEventListener('contextmenu',e=>e.preventDefault());
function syncMusic(){if(soundOn&&!menu.classList.contains('closed')&&!document.hidden)score.play().catch(()=>{});else score.pause()}
function syncMotion(){films.forEach((v,i)=>{if(i===active&&motionOn&&!document.hidden&&!menu.classList.contains('closed'))v.play().catch(()=>{});else v.pause()});$('#motion').textContent=motionOn?'Ⅱ':'▷';$('#motion').setAttribute('aria-label',motionOn?'暂停背景动画':'播放背景动画')}
function showFilm(n){
 const token=++filmToken,next=active===0?1:0,v=films[next],old=active;v.pause();v.classList.remove('active');v.src=clips[n];v.loop=n!==0;motionOn=!reduced.matches;v.onended=()=>{if(n===0){motionOn=false;syncMotion()}};v.poster=n===2?'menu-destination.webp':'menu-ensemble.webp';v.muted=true;v.preload='auto';
 $('#still').style.backgroundImage=`url('${v.poster}')`;
 v.onloadeddata=()=>{if(token!==filmToken)return;active=next;v.classList.add('active');if(old>=0){films[old].classList.remove('active');films[old].pause();setTimeout(()=>{if(token===filmToken&&active!==old){films[old].removeAttribute('src');films[old].load()}},650)}syncMotion()};
 v.onerror=()=>{if(token!==filmToken)return;films.forEach(f=>{f.pause();f.classList.remove('active')});active=-1;notice('动画暂未载入，先用花园画面继续。')};v.load();
}
function navigate(n){page=n;document.querySelectorAll('[data-page]').forEach(el=>el.hidden=Number(el.dataset.page)!==n);$('#small-logo').style.visibility=n===0?'hidden':'visible';state.hidden=n===0;$('#loading').hidden=!starting||ready;showFilm(n);if(callback)callback('sound');syncMusic()}
function loadProgress(f,label){$('#loading i').style.width=`${Math.max(0,Math.min(1,f))*100}%`;state.textContent=label}
window.wakukuMenu={bind(fn){callback=fn},progress(f){loadProgress(.9+f*.1,`正在铺开花草与溪流 · ${Math.round(f*100)}%`)},ready(hasSave){ready=true;saved=hasSave;$('#loading').hidden=true;state.textContent='小星球已准备好 · 当前开放苔苔与风铃草甸';$('#restart-label').hidden=!saved;enter.disabled=false;enter.textContent=saved?'继续草甸来信　→':'进入风铃草甸　→'},open(){menu.hidden=false;menu.classList.remove('closed');canvas.blur();navigate(1);requestAnimationFrame(()=>$('#choose-cast').blur());syncMusic()}};
const engine=new Engine({...CONFIG,canvas,locale:'zh_CN',onPrint:(...args)=>{console.log(...args);if(args.join(' ').includes('WAKUKU_GODOT_READY'))running=true},onPrintError:(...args)=>console.error(...args)});
async function boot(){if(starting)return;starting=true;$('#loading').hidden=false;error.textContent='';try{const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw new Error('浏览器缺少 '+missing.join('、')+'，请使用新版 Chrome 或 Edge。');loadProgress(0,'正在打开小星球…');await engine.startGame({onProgress:(current,total)=>{if(total>0)loadProgress(current/total*.9,`正在载入 ${Math.round(current/1048576)} / ${Math.round(total/1048576)} MB`)},onExit:()=>{running=false;notice('游戏已关闭，刷新页面可重新进入。')}});fitCanvas()}catch(e){error.textContent='载入未完成：'+e.message+'。请刷新页面重试。';starting=false}}
$('#choose-cast').onclick=()=>{navigate(1);boot()};document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(Number(b.dataset.nav)));
document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{if(callback)callback('sound');const name=b.querySelector('strong').textContent;if(b.dataset.character==='moss'){$('#cast-caption').textContent='苔苔 · 照料一朵花，认识整个世界。';return}$('#cast-caption').textContent=name+'的来信还在路上。现在可以和苔苔先出发。'});
document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{if(callback)callback('sound');if(b.dataset.place!=='meadow')notice(b.querySelector('h3').textContent+'尚未开放。当前可进入风铃草甸。')});
enter.onclick=()=>{if(!ready||!callback)return;menu.classList.add('closed');films.forEach(v=>v.pause());score.pause();canvas.focus();callback('enter',$('#restart').checked);setTimeout(()=>{if(menu.classList.contains('closed'))menu.hidden=true},500)};
$('#motion').onclick=()=>{motionOn=!motionOn;if(active>=0&&films[active].ended)films[active].currentTime=0;syncMotion()};$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'菜单音乐 · 开':'菜单音乐 · 关';$('#sound').setAttribute('aria-pressed',String(soundOn));syncMusic()};
document.addEventListener('visibilitychange',()=>{syncMotion();syncMusic()});reduced.addEventListener('change',e=>{motionOn=!e.matches;syncMotion()});
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();if(menu.classList.contains('closed'))canvas.focus()}catch(e){notice('浏览器未允许全屏，可手动放大窗口。')}};
$('#save-out').onclick=()=>{if(!window.wakukuSave){notice('请先选择旅伴，等待小星球载入完成。');return}const blob=new Blob([window.wakukuSave],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='WAKUKU-星球来信-存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#save-in').onclick=()=>{if(!window.wakukuImportSave){notice('请先选择旅伴，等待小星球载入完成。');return}$('#save-file').click()};
$('#save-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000)throw new Error('文件过大');const record=JSON.parse(await f.text());if(record.game!=='wakuku-planet-letter'||record.version!==1||!Number.isInteger(record.step)||record.step<0||record.step>7||!['','stay','return'].includes(record.choice))throw new Error('不是有效的星球来信存档');window.wakukuImportSave(JSON.stringify(record));notice('存档已导入，请从旅程选择页继续。')}catch(e){notice('无法导入：'+e.message)}finally{e.target.value=''}};
navigate(0);
</script></body></html>
